<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotorStore - Detalle de Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Encabezado y Navegación Unificada -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 py-3 shadow-sm">
            <div class="container-fluid">
                <!-- Logo de la tienda -->
                <a class="navbar-brand fw-bold fs-3 text-white tracking-wide" href="index.html">MotorStore</a>
                
                <!-- Botón Hamburguesa para pantallas medianas/pequeñas -->
                <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                
                <!-- Contenido del menú colapsable -->
                <div class="collapse navbar-collapse justify-content-end align-items-center" id="navbarNav">
                    <ul class="navbar-nav align-items-lg-center gap-1 mb-2 mb-lg-0 text-center text-lg-start">
                        <li class="nav-item"><a class="nav-link px-2 text-nowrap" href="index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link px-2 text-nowrap" href="Productos.html">Productos</a></li>
                        <li class="nav-item"><a class="nav-link px-2 text-nowrap" href="RegistroUsuario.html">Registro Usuario</a></li>
                        <li class="nav-item"><a class="nav-link px-2 text-nowrap" href="IniciarSesion.html">Iniciar Sesión</a></li>
                        <li class="nav-item"><a class="nav-link px-2 text-nowrap" href="Nosotros.html">Nosotros</a></li>
                        <li class="nav-item"><a class="nav-link px-2 text-nowrap" href="Blogs.html">Blogs</a></li>
                        <li class="nav-item"><a class="nav-link px-2 text-nowrap" href="Contacto.html">Contacto</a></li>
                        <!-- Botón Carrito unificado -->
                        <li class="nav-item my-2 my-lg-0 ms-lg-2">
                            <a href="Carrito.html" class="btn btn-info text-dark fw-bold px-3 py-1 rounded-pill text-nowrap carrito-btn">🛒 Carrito (0)</a>
                        </li>
                    </ul>
                    <!-- Botón Modo Oscuro alineado -->
                    <button id="btn-modo-oscuro" class="btn btn-outline-light ms-lg-3 mt-2 mt-lg-0 btn-sm px-3 py-2 text-nowrap">Modo Oscuro</button>
                </div>
            </div>
        </nav>
    </header>

    <main class="py-5">
        <div class="container" style="max-width: 1000px;" id="detalle-producto-js">
            
            <!-- Ruta de navegación limpia y separada -->
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a href="Productos.html" class="text-decoration-none" style="color:#0d6efd;">Productos</a></li>
                    <li class="breadcrumb-item active" aria-current="page" id="detalle-breadcrumb" style="color:#212529;">Detalle Producto</li>
                </ol>
            </nav>

            <!-- Caja contenedora del producto independiente -->
            <div class="bg-light p-4 rounded shadow-sm border border-secondary text-dark mt-3">
                <div class="row g-5 align-items-center">
                    <!-- Imagen Principal -->
                    <div class="col-12 col-md-6 d-flex justify-content-center">
                        <img id="detalle-img" src="" class="rounded border border-dark object-fit-contain" alt="" style="height: 350px; max-width: 100%; background-color: #f8f9fa;">
                    </div>

                    <!-- Información y Botón de Compra -->
                    <div class="col-12 col-md-6">
                        <h2 class="fw-bold mb-2" id="detalle-nombre"></h2>
                        <h3 class="text-success fw-bold mb-4" id="detalle-precio"></h3>
                        
                        <p class="text-secondary mb-4" id="detalle-descripcion"></p>

                        <div class="mb-4">
                            <label for="cantidad-prod" class="form-label fw-bold">Cantidad</label>
                            <input type="number" id="cantidad-prod" class="form-control border-dark w-50" value="1" min="1">
                        </div>

                        <button id="detalle-btn-agregar" class="btn btn-dark w-100 fw-bold py-2 text-uppercase">Añadir al carrito</button>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0">© 2026, <strong>MotorStore</strong> · Santiago, Chile</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/script.js"></script>
</body>
</html>
