<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotorStore - Admin Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-admin-page="true">
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 py-3 shadow-sm">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold fs-3 text-white tracking-wide" href="AdminHome.html">MotorStore <span class="badge bg-info text-dark ms-2">Admin</span></a>
                <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end align-items-center" id="navbarNav">
                    <ul class="navbar-nav align-items-lg-center gap-1 mb-2 mb-lg-0 text-center text-lg-start me-lg-3">
                        <li class="nav-item"><a class="nav-link px-2 text-nowrap" href="AdminHome.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link px-2 text-nowrap" href="AdminProductos.html">Productos</a></li>
                        <li class="nav-item"><a class="nav-link px-2 text-nowrap" href="AdminUsuarios.html">Usuarios</a></li>
                    </ul>
                    <span class="text-white me-3 small">Sesión: <strong id="admin-correo-actual"></strong></span>
                    <button id="btn-cerrar-sesion" class="btn btn-outline-light btn-sm px-3">Cerrar sesión</button>
                </div>
            </div>
        </nav>
    </header>

    <main class="py-5">
        <div class="container">
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="AdminHome.html" class="text-decoration-none">Admin Home</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Productos</li>
                </ol>
            </nav>

            <div class="card shadow-sm border-secondary">
                <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                    <span class="fw-bold">Catálogo de Productos</span>
                    <a href="AdminProductoNuevo.html" class="btn btn-info btn-sm text-dark fw-bold">+ Nuevo Producto</a>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre</th>
                                    <th>Categoría</th>
                                    <th>Precio</th>
                                    <th class="text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="admin-tabla-productos"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0">© 2026, <strong>MotorStore</strong> · Panel interno · Santiago, Chile</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/script.js"></script>
</body>
</html>
