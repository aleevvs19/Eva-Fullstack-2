<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotorStore - Editar Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-admin-page="true">
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 py-3 shadow-sm">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold fs-3 text-white tracking-wide" href="AdminHome.html">MotorStore <span class="badge bg-info text-dark ms-2">Admin</span></a>
                <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end align-items-center" id="navbarNav">
                    <ul class="navbar-nav align-items-lg-center gap-1 mb-2 mb-lg-0 text-center text-lg-start me-lg-3">
                        <li class="nav-item"><a class="nav-link px-2 text-nowrap" href="AdminHome.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link px-2 text-nowrap" href="AdminProductos.html">Productos</a></li>
                        <li class="nav-item"><a class="nav-link px-2 text-nowrap" href="AdminUsuarios.html">Usuarios</a></li>
                    </ul>
                    <span class="text-white me-3 small">Sesión: <strong id="admin-correo-actual"></strong></span>
                    <button id="btn-cerrar-sesion" class="btn btn-outline-light btn-sm px-3">Cerrar sesión</button>
                </div>
            </div>
        </nav>
    </header>

    <main class="py-5">
        <div class="container d-flex justify-content-center">
            <div class="card w-100 shadow-sm border-0" style="max-width: 650px;">
                <div class="card-header bg-secondary text-white text-center py-3">
                    <h4 class="mb-0 text-uppercase fw-bold">Editar Producto</h4>
                </div>
                <div class="card-body p-4 bg-light text-dark">
                    <form id="form-editar-producto" novalidate>
                        <div class="mb-3">
                            <label for="ep-nombre" class="form-label fw-bold">NOMBRE</label>
                            <input type="text" class="form-control border-dark" id="ep-nombre">
                        </div>
                        <div class="mb-3">
                            <label for="ep-categoria" class="form-label fw-bold">CATEGORÍA</label>
                            <input type="text" class="form-control border-dark" id="ep-categoria">
                        </div>
                        <div class="mb-3">
                            <label for="ep-precio" class="form-label fw-bold">PRECIO (CLP)</label>
                            <input type="number" class="form-control border-dark" id="ep-precio" min="1">
                        </div>
                        <div class="mb-3">
                            <label for="ep-imagen" class="form-label fw-bold">RUTA DE IMAGEN</label>
                            <input type="text" class="form-control border-dark" id="ep-imagen">
                        </div>
                        <div class="mb-4">
                            <label for="ep-descripcion" class="form-label fw-bold">DESCRIPCIÓN</label>
                            <textarea class="form-control border-dark" id="ep-descripcion" rows="4"></textarea>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="AdminProductos.html" class="btn btn-outline-secondary px-4">Cancelar</a>
                            <button type="submit" class="btn btn-dark px-4 fw-bold text-uppercase">Guardar Cambios</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0">© 2026, <strong>MotorStore</strong> · Panel interno · Santiago, Chile</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/script.js"></script>
</body>
</html>
